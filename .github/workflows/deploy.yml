name: Deploy Covenant API to OCI

on:
push:
branches:
- main # This triggers the deployment whenever you push to the main branch

jobs:
build-and-deploy:
runs-on: ubuntu-latest

steps:
- name: Checkout Code
  uses: actions/checkout@v3

- name: Set up JDK 17
  uses: actions/setup-java@v3
  with:
    java-version: '17' # Change to '21' if your Spring Boot app uses Java 21
    distribution: 'temurin'
    cache: maven

- name: Build with Maven
  run: mvn clean package -DskipTests 

- name: Copy JAR to OCI Instance
  uses: appleboy/scp-action@master
  with:
    host: ${{ secrets.OCI_HOST }}
    username: ${{ secrets.OCI_USERNAME }}
    key: ${{ secrets.OCI_SSH_KEY }}
    source: "target/*.jar"
    target: "/home/ubuntu/platform/" # Updated to match your server folder
    strip_components: 1

- name: Restart Application via SSH
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.OCI_HOST }}
    username: ${{ secrets.OCI_USERNAME }}
    key: ${{ secrets.OCI_SSH_KEY }}
    script: |
      # Rename the uploaded jar to a consistent name
      mv /home/ubuntu/platform/*.jar /home/ubuntu/platform/covenant-api.jar
      # Restart the background service
      sudo systemctl restart covenant-app.service
